name: Speaker diarization checks

on:
  push:
    branches: [feature/speaker-diarization]
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile app and worker
        run: python -m compileall -q transcribe-gui.py speaker_segments.py diarization_runner.py diarization_worker.py
      - name: Pure Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate PowerShell setup script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          Get-ChildItem -Path scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Message) in $($_.FullName)" }
              exit 1
            }
          }
      - name: Verify speaker smoke-test reporting on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test-smoke-test-speakers.ps1
